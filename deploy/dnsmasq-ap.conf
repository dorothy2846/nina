interface=wlan0
dhcp-range=192.168.4.2,192.168.4.20,255.255.255.0,24h

# Long DHCP lease for field use (reconnecting devices get same IP)
dhcp-option=option:router,192.168.4.1
dhcp-option=option:dns-server,192.168.4.1

# Local-only network — don't forward DNS queries to upstream.
# iPhone will detect "no internet" on this WiFi and automatically
# use cellular for internet traffic (Wi-Fi Assist).
# Local connections to 192.168.4.1 still go through WiFi.
no-resolv
